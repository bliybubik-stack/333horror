<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ОТКРОЙ ДВЕРЬ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <div class="hud">

        <div>
            <b>ОТКРОЙ ДВЕРЬ</b>
        </div>

        <div id="time">
            23:41
        </div>

        <div>
            НОЧЬ <span id="night">1</span>
        </div>

    </div>


    <main>

        <!-- КОМНАТА -->

        <div
            id="room"
            class="room"
        >

            <!-- ВСЯ КОМНАТА КАРТИНКОЙ -->

            <img
                src="assets/room/room.png"
                class="room-image"
                alt=""
            >


            <!-- ДВЕРЬ -->

            <img
                src="assets/room/door.png"
                class="door-image"
                alt=""
            >


            <!-- ЗВОНОК -->

            <button
                id="doorbell"
                class="doorbell"
            >

                <img
                    src="assets/room/doorbell.png"
                    alt="Звонок"
                >

            </button>


            <!-- ТЕКСТ -->

            <div
                id="doorMessage"
                class="door-message"
            >
                Сижу. Жду.
            </div>

        </div>


        <!-- ПАНЕЛЬ ПОСЕТИТЕЛЯ -->

        <div
            id="visitorScreen"
            class="visitor-screen hidden"
        >

            <div class="visitor-header">

                <span>
                    КТО-ТО У ДВЕРИ
                </span>

                <span id="visitorId">
                    #001
                </span>

            </div>


            <!-- ГЛАЗОК -->

            <div class="peephole">

                <img
                    id="visitorImage"
                    src=""
                    alt=""
                >

                <div class="peephole-dark"></div>

                <div class="scanlines"></div>

            </div>


            <!-- ИНФОРМАЦИЯ -->

            <div class="visitor-data">

                <h2 id="visitorName">
                    НЕИЗВЕСТНЫЙ
                </h2>

                <div id="visitorAge">
                    Возраст: ?
                </div>

                <p id="visitorDescription">
                    ...
                </p>

                <div
                    id="visitorType"
                    class="visitor-type"
                >
                    ...
                </div>

            </div>


            <!-- ТАЙМЕР -->

            <div class="visitor-timer">
                У двери:
                <span id="timer">
                    00:00
                </span>
            </div>


            <!-- КНОПКИ -->

            <div class="actions">

                <button
                    id="openButton"
                    class="open-button"
                >
                    ВПУСТИТЬ
                </button>

                <button
                    id="rejectButton"
                    class="reject-button"
                >
                    ПОШЁЛ НАХУЙ
                </button>

            </div>

        </div>

    </main>


    <footer>

        <span id="status">
            Тишина.
        </span>

        <span>
            Впущено:
            <b id="letIn">0</b>

            &nbsp; | &nbsp;

            Послано:
            <b id="rejected">0</b>
        </span>

    </footer>


    <!-- ЧЁРНЫЙ ЭКРАН -->

    <div
        id="blackScreen"
        class="black-screen hidden"
    >

        <div id="blackText">
            ...
        </div>

    </div>


    <!-- СКРИМЕР -->

    <div
        id="jumpscare"
        class="jumpscare hidden"
    >

        <img
            id="jumpscareImage"
            src=""
            alt=""
        >

    </div>


    <!-- КОНЦОВКА -->

    <div
        id="ending"
        class="ending hidden"
    >

        <div class="ending-box">

            <div
                id="endingNumber"
                class="ending-number"
            >
                КОНЦОВКА 1
            </div>

            <h1 id="endingTitle">
                ...
            </h1>

            <p id="endingText">
                ...
            </p>

            <button id="restart">
                ЕЩЁ РАЗ
            </button>

        </div>

    </div>


    <!-- AUDIO -->

    <audio
        id="doorbellSound"
        src="assets/audio/doorbell.mp3"
    ></audio>

    <audio
        id="knockSound"
        src="assets/audio/knock.mp3"
    ></audio>

    <audio
        id="breathingSound"
        src="assets/audio/breathing.mp3"
    ></audio>

    <audio
        id="whisperSound"
        src="assets/audio/whisper.mp3"
    ></audio>

    <audio
        id="jumpscareSound"
        src="assets/audio/jumpscare.mp3"
    ></audio>

</div>

<script src="app.js"></script>

</body>
</html>
