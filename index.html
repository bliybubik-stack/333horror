<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИГОРЬ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- ROOM -->

    <div id="room">

        <img id="door" src="assets/door.png">

        <button id="bellButton">
            <img src="assets/bell.png">
        </button>

        <div id="roomText">
            Тишина...
        </div>

    </div>


    <!-- VISITOR -->

    <div id="visitorPanel" class="hidden">

        <div class="topbar">
            <span>ДВЕРЬ</span>
            <span id="igorCounter">0 / 30</span>
        </div>


        <div id="peephole">

            <img id="igorImage">

            <div class="darkness"></div>

            <div class="grain"></div>

        </div>


        <div id="visitorInfo">

            <h1 id="igorName">
                ИГОРЬ
            </h1>

            <p id="igorType">
                ...
            </p>

            <p id="igorDescription">
                ...
            </p>

        </div>


        <div id="inspectText">
            Посмотри внимательнее.
        </div>


        <div class="buttons">

            <button id="inspectButton">
                ОСМОТРЕТЬ
            </button>

            <button id="openButton">
                ОТКРЫТЬ
            </button>

            <button id="leaveButton">
                ПОШЁЛ НАХУЙ
            </button>

        </div>

    </div>


    <!-- MESSAGE -->

    <div id="message" class="hidden">

        <div id="messageText"></div>

    </div>


</div>

<script src="app.js"></script>

</body>
</html>
