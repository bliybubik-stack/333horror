<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#070707"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>Открой дверь</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

<div
    class="game"
    id="game"
>


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="topbar">

        <div class="logo">
            ОТКРОЙ ДВЕРЬ
        </div>

        <div
            class="night"
            id="night"
        >
            НОЧЬ 01
        </div>

    </header>



    <!-- =========================================
         MAIN ROOM
    ========================================== -->

    <main
        class="room"
        id="room"
    >

        <!-- Darkness overlay -->

        <div
            class="room-darkness"
            aria-hidden="true"
        ></div>



        <!-- =====================================
             DOOR FRAME
        ====================================== -->

        <div
            class="door-frame"
            id="doorFrame"
        >

            <img
                src="assets/door.png"
                class="door"
                id="door"
                alt="Дверь"
                draggable="false"
            >

        </div>



        <!-- =====================================
             BELL BUTTON
        ====================================== -->

        <button
            class="bell-button"
            id="bellButton"
            type="button"
            aria-label="Позвонить в дверь"
        >

            <img
                src="assets/bell.png"
                alt=""
                draggable="false"
            >

            <span>
                ПОЗВОНИТЬ
            </span>

        </button>



        <!-- =====================================
             STATUS
        ====================================== -->

        <div
            class="status"
            id="status"
            aria-live="polite"
        >
            В квартире тихо.
        </div>

    </main>



    <!-- =========================================
         SOMEONE AT THE DOOR PANEL
    ========================================== -->

    <section
        class="event-panel hidden"
        id="eventPanel"
        aria-label="Кто-то у двери"
    >

        <div class="event-top">

            <span class="event-label">
                У ДВЕРИ
            </span>

            <span
                class="event-time"
                id="eventTime"
            >
                23:41
            </span>

        </div>



        <div class="event-content">

            <div
                class="event-icon"
                aria-hidden="true"
            >
                !
            </div>


            <div class="event-text">

                <h2 id="eventTitle">
                    Кто-то стучит.
                </h2>

                <p id="eventDescription">
                    За дверью кто-то стоит.
                </p>

            </div>

        </div>



        <div class="event-actions">

            <button
                class="action secondary"
                id="lookButton"
                type="button"
            >
                ПОСМОТРЕТЬ
            </button>


            <button
                class="action secondary"
                id="ignoreButton"
                type="button"
            >
                НЕ ОТКРЫВАТЬ
            </button>

        </div>

    </section>



    <!-- =========================================
         PEEPHOLE / INSPECTION SCREEN
    ========================================== -->

    <section
        class="inspect hidden"
        id="inspect"
        aria-label="Осмотр посетителя"
    >

        <!-- Header -->

        <div class="inspect-header">

            <span>
                ГЛАЗОК
            </span>


            <button
                class="close"
                id="closeInspect"
                type="button"
                aria-label="Закрыть"
            >
                ×
            </button>

        </div>



        <!-- =====================================
             PEEPHOLE
        ====================================== -->

        <div
            class="peephole"
            id="peephole"
        >

            <img
                id="igorImage"
                src=""
                alt="Человек за дверью"
                draggable="false"
            >


            <div
                class="peephole-shadow"
                aria-hidden="true"
            ></div>


            <div
                class="noise"
                aria-hidden="true"
            ></div>

        </div>



        <!-- =====================================
             IGOR INFORMATION
        ====================================== -->

        <div class="igor-info">


            <div class="igor-name-row">

                <h2 id="igorName">
                    ИГОРЬ
                </h2>


                <span
                    class="tag"
                    id="igorType"
                >
                    ?
                </span>

            </div>



            <p id="igorDescription">
                За дверью кто-то стоит.
            </p>



            <!-- Information cards -->

            <div class="inspection">


                <div>

                    <small>
                        ВОЗРАСТ
                    </small>

                    <strong id="igorAge">
                        ?
                    </strong>

                </div>



                <div>

                    <small>
                        СОСТОЯНИЕ
                    </small>

                    <strong id="igorState">
                        ?
                    </strong>

                </div>



                <div>

                    <small>
                        РЕАКЦИЯ
                    </small>

                    <strong id="igorReaction">
                        ?
                    </strong>

                </div>


            </div>



            <!-- Lore -->

            <p
                class="lore"
                id="igorLore"
            >
                ...
            </p>

        </div>



        <!-- =====================================
             DECISION BUTTONS
        ====================================== -->

        <div class="inspect-actions">


            <button
                class="action open"
                id="openButton"
                type="button"
            >
                ОТКРЫТЬ
            </button>


            <button
                class="action reject"
                id="rejectButton"
                type="button"
            >
                ПОШЁЛ НАХУЙ
            </button>


        </div>

    </section>



    <!-- =========================================
         MESSAGE OVERLAY
    ========================================== -->

    <div
        class="message hidden"
        id="message"
        role="dialog"
        aria-modal="true"
        aria-labelledby="messageTitle"
    >

        <div class="message-box">


            <div
                class="message-title"
                id="messageTitle"
            >
                Тишина.
            </div>



            <div
                class="message-text"
                id="messageText"
            >
                ...
            </div>



            <button
                class="action"
                id="continueButton"
                type="button"
            >
                ПОНЯТНО
            </button>


        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="app.js"></script>

</div>

</body>

</html>
